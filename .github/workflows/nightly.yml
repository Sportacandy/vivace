name: Nightly

# Rebuilds a single rolling "nightly" pre-release on every push to main, so
# users can grab the latest build between version tags. See release.yml for
# the tag-triggered permanent releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        # A kit from a vivace-qt-build release, with the Vivace qtmultimedia
        # patches and an LGPL FFmpeg (see .github/actions/install-qt-kit).
        uses: ./.github/actions/install-qt-kit
        with:
          kit: msvc2022_64

      - name: Install Meson/Ninja (needed to build libbluray from source for Blu-ray Disc playback)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            choco install meson ninja -y
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "choco install meson/ninja failed (attempt $i), retrying in 30s..."
            Start-Sleep -Seconds 30
            if ($i -eq 3) { exit 1 }
          }
          # choco's meson package is MSI-based and updates the MACHINE/USER
          # PATH in the registry, but does NOT refresh this (or any later
          # step's) already-running process environment -- choco itself
          # warns "Environment Vars (like PATH) have changed. Close/reopen
          # your shell..." and GitHub Actions never does that mid-job. Found
          # the hard way: v0.4.1's real release build silently produced a
          # Blu-ray-DISABLED binary because CMake's find_program(meson)
          # couldn't see it, even though choco reported success. Re-read the
          # registry PATH directly and publish each tool's real directory to
          # $GITHUB_PATH so every later step (in particular CMake's own
          # configure) can see it too -- ninja is included defensively even
          # though it's normally already preinstalled on this runner image.
          $refreshedPath = @(
              [System.Environment]::GetEnvironmentVariable('Path', 'Machine'),
              [System.Environment]::GetEnvironmentVariable('Path', 'User'),
              $env:Path
          ) -join ';'
          $env:Path = $refreshedPath
          foreach ($tool in @('meson', 'ninja')) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $cmd) {
              Write-Error "$tool not found on PATH even after refreshing from the registry"
              exit 1
            }
            $dir = Split-Path $cmd.Source -Parent
            Write-Host "Adding $dir to GITHUB_PATH for $tool"
            Add-Content -Path $env:GITHUB_PATH -Value $dir
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            choco install nsis -y
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "choco install nsis failed (attempt $i), retrying in 30s..."
            Start-Sleep -Seconds 30
          }
          exit 1

      - name: Build installer
        shell: pwsh
        run: packaging/windows/build_installer.ps1 -QtDir "$env:QT_ROOT_DIR"

      - name: Rename installer
        shell: pwsh
        run: Rename-Item VivaceSetup-Release.exe VivaceSetup-Nightly.exe

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Automatic build from the latest `main` commit (${{ github.sha }}).
            May be unstable — prefer a tagged release for daily use.
          files: VivaceSetup-Nightly.exe

  build-and-release-linux:
    needs: build-and-release
    # The gcc_64 kit of vivace-qt-build was built on Ubuntu 24.04 and links
    # its ICU 74, which newer Ubuntu runners don't have.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        # libva2/libva-drm2: the FFmpeg of the kit links libva.so.2 and
        # libva-drm.so.2 (VA-API).
        # The -dev packages after libva-drm2: the system libraries that the Qt
        # libraries, tools (moc, rcc) and plugins of the kit link, for
        # example libb2 and ICU. They are packages that built the kit.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev patchelf ninja-build meson libx11-dev libxext-dev libxrandr-dev libwayland-dev libminizip1 libva2 libva-drm2 \
            libb2-dev libbrotli-dev libdbus-1-dev libicu-dev libpcre2-dev libzstd-dev libegl-dev libopengl-dev libdrm-dev libinput-dev libmtdev-dev libts-dev libudev-dev

      - name: Install Qt
        # A kit from a vivace-qt-build release, with the Vivace qtmultimedia
        # patches and an LGPL FFmpeg (see .github/actions/install-qt-kit).
        uses: ./.github/actions/install-qt-kit
        with:
          kit: gcc_64

      - name: Build tarball
        run: |
          chmod +x packaging/linux/build_installer.sh
          QT_DIR="$QT_ROOT_DIR" packaging/linux/build_installer.sh --tarball

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          make_latest: false
          files: Vivace-linux-x86_64.tar.gz

  build-and-release-linux-arm64:
    needs: build-and-release
    runs-on: ubuntu-24.04-arm
    # Uses the gcc_arm64_ubuntu kit, which vivace-qt-build builds on the same
    # ubuntu-24.04-arm runner, so the Qt libraries link the libraries of
    # Ubuntu 24.04 (glibc 2.39, ICU 74), as Vivace itself does here. The
    # gcc_arm64 kit of the bookworm job below links Debian 12 libraries (ICU
    # 72), which Ubuntu 24.04 doesn't have. Without QtWebEngine in the kit,
    # CMakeLists.txt turns off the embedded YouTube login.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        # libva2/libva-drm2: the FFmpeg of the kit links libva.so.2 and
        # libva-drm.so.2 (VA-API).
        # The -dev packages after libva-drm2: the system libraries that the Qt
        # libraries, tools (moc, rcc) and plugins of the kit link, for
        # example libb2 and ICU. They are packages that built the kit.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev patchelf ninja-build meson libx11-dev libxext-dev libxrandr-dev libwayland-dev libminizip1 libva2 libva-drm2 \
            libb2-dev libbrotli-dev libdbus-1-dev libicu-dev libpcre2-dev libzstd-dev libegl-dev libopengl-dev libdrm-dev libinput-dev libmtdev-dev libts-dev libudev-dev

      - name: Install Qt
        # A kit from a vivace-qt-build release, with the Vivace qtmultimedia
        # patches and an LGPL FFmpeg (see .github/actions/install-qt-kit).
        uses: ./.github/actions/install-qt-kit
        with:
          kit: gcc_arm64_ubuntu

      - name: Build tarball
        run: |
          chmod +x packaging/linux/build_installer.sh
          QT_DIR="$QT_ROOT_DIR" packaging/linux/build_installer.sh --tarball

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          make_latest: false
          files: Vivace-linux-aarch64.tar.gz

  build-and-release-linux-arm64-bookworm:
    needs: build-and-release
    runs-on: ubuntu-24.04-arm
    # A SECOND arm64 Linux build, specifically for Raspberry Pi OS (Debian
    # 12 "bookworm", glibc 2.36). Building Vivace INSIDE a debian:bookworm
    # container (native on this arm64 host, no QEMU) produces binaries that
    # only need glibc 2.36. The gcc_arm64 kit of vivace-qt-build is built in
    # the same container image, so its Qt libraries need glibc 2.36 too.
    # xz-utils extracts the kit; libva2/libva-drm2 are for its FFmpeg; the
    # last -dev packages are the system libraries that the Qt libraries,
    # tools (moc, rcc) and plugins of the kit link, for example libb2.
    container:
      image: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build git \
            curl ca-certificates perl python3 \
            pkg-config patchelf libssl-dev libgl1-mesa-dev meson \
            libglu1-mesa-dev libwayland-dev libfontconfig1-dev libfreetype-dev \
            libgtk-3-dev libx11-dev libx11-xcb-dev libxcb-cursor-dev \
            libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xkb-dev \
            libxcb1-dev libxext-dev libxfixes-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrender-dev libatspi2.0-dev \
            libpulse-dev xz-utils libva2 libva-drm2 \
            libb2-dev libbrotli-dev libdbus-1-dev libicu-dev libpcre2-dev libzstd-dev libegl-dev libopengl-dev libdrm-dev libinput-dev libmtdev-dev libts-dev libudev-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        # A kit from a vivace-qt-build release, with the Vivace qtmultimedia
        # patches and an LGPL FFmpeg (see .github/actions/install-qt-kit).
        uses: ./.github/actions/install-qt-kit
        with:
          kit: gcc_arm64

      - name: Build tarball
        run: |
          chmod +x packaging/linux/build_installer.sh
          QT_DIR="$QT_ROOT_DIR" packaging/linux/build_installer.sh --tarball
          mv Vivace-linux-aarch64.tar.gz Vivace-linux-aarch64-bookworm.tar.gz

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          make_latest: false
          files: Vivace-linux-aarch64-bookworm.tar.gz

  build-and-release-macos:
    needs: build-and-release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        # A kit from a vivace-qt-build release, with the Vivace qtmultimedia
        # patches and an LGPL FFmpeg (see .github/actions/install-qt-kit).
        uses: ./.github/actions/install-qt-kit
        with:
          # The macos kit is arm64 only, so the dmg is for Apple silicon.
          kit: macos

      - name: Install Meson/Ninja (needed to build libbluray from source for Blu-ray Disc playback)
        run: brew install meson ninja

      - name: Build dmg
        run: |
          chmod +x packaging/macos/build_installer.sh
          QT_DIR="$QT_ROOT_DIR" packaging/macos/build_installer.sh --dmg

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          make_latest: false
          files: Vivace-macos.dmg

  build-and-release-android:
    needs: build-and-release
    runs-on: windows-latest
    # NEW (2026-09-20): builds a real, installable Android APK, extending the
    # compile-only Android job already proven working in build.yml (see that
    # job's own comment history for the SDK/NDK/Qt-for-Android setup and the
    # three real CI fixes it took to get there -- the setup steps here mirror
    # it exactly). The one addition: a JDK (AGP 9.0.0's own compatibility
    # table requires JDK 17 minimum, confirmed directly against
    # developer.android.com/build/releases/agp-9-0-0-release-notes) and
    # building the `vivace_make_apk` target instead of plain `vivace`, which
    # runs androiddeployqt + Gradle to actually produce a package (per Qt's
    # own qt_android_add_apk_target docs: qt_add_executable already wires
    # this target up automatically, no qt_android_add_apk_target() call
    # needed in CMakeLists.txt).
    #
    # DEBUG-SIGNED, not a production release build: no real Android signing
    # keystore/secrets exist for this project yet (matching every other
    # platform here -- none of them have real code-signing set up either,
    # see this project's own [[project-vivace-code-signing-reputation]]
    # history), so this is Gradle's own auto-generated debug key. Good
    # enough to sideload and test, not to publish to the Play Store as-is.
    #
    # Uses the android_arm64_v8a kit of vivace-qt-build, which has the
    # four qtmultimedia patches, with its host kit mingw1310_64. That is why
    # this job runs on Windows (see build.yml's build-android job).
    #
    # UNVERIFIED as of this writing: this is the first time this project's
    # CI has ever built (not just compiled) an Android APK -- the exact
    # output path/filename from androiddeployqt+Gradle is discovered via a
    # glob rather than hardcoded, specifically because guessing it wrong is
    # exactly the class of mistake this whole Android CI effort kept hitting
    # (see build.yml's own job history); expect this may still need a
    # follow-up fix once it actually runs, and the resulting APK still needs
    # a real device/emulator install test before being trusted.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Meson, Ninja, GNU Make and MinGW GCC
        # Meson/Ninja build libbluray from source. GNU Make runs FFmpeg's
        # build in scripts/build-android-youtube-tools.sh: Git for Windows
        # ships no make.exe, and that script expects Chocolatey's GNU Make,
        # as on the local Windows dev machine. Same choco install and
        # registry-PATH refresh as the Windows job above -- see its comment
        # for why.
        # MinGW GCC is the host compiler of FFmpeg's configure (HOST_CC):
        # the clang of the runner is in "C:\Program Files", and configure
        # cannot use a compiler path with spaces.
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            choco install meson ninja make mingw -y
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "choco install meson/ninja/make/mingw failed (attempt $i), retrying in 30s..."
            Start-Sleep -Seconds 30
            if ($i -eq 3) { exit 1 }
          }
          $env:Path = @(
              [System.Environment]::GetEnvironmentVariable('Path', 'Machine'),
              [System.Environment]::GetEnvironmentVariable('Path', 'User'),
              $env:Path
          ) -join ';'
          foreach ($tool in @('meson', 'ninja', 'make')) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $cmd) {
              Write-Error "$tool not found on PATH even after refreshing from the registry"
              exit 1
            }
            $dir = Split-Path $cmd.Source -Parent
            Write-Host "Adding $dir to GITHUB_PATH for $tool"
            Add-Content -Path $env:GITHUB_PATH -Value $dir
          }
          # HOST_CC names the GCC of the MinGW package. GITHUB_PATH does not
          # get its directory, so the later steps do not find GCC instead of
          # their own compilers. If the package is elsewhere, another native
          # GCC on PATH does the same job.
          $chocoGcc = 'C:\ProgramData\mingw64\mingw64\bin\gcc.exe'
          if (Test-Path $chocoGcc) {
            $gcc = Get-Command $chocoGcc
          } else {
            $gcc = Get-Command gcc -ErrorAction SilentlyContinue
          }
          if (-not $gcc) {
            Write-Error "No gcc found at $chocoGcc or on PATH after the MinGW install"
            exit 1
          }
          $hostCc = $gcc.Source -replace '\\', '/'
          if ($hostCc -match ' ') {
            Write-Error "The MinGW GCC path has a space, which FFmpeg's configure cannot use: $hostCc"
            exit 1
          }
          & $gcc.Source --version
          Write-Host "HOST_CC=$hostCc"
          Add-Content -Path $env:GITHUB_ENV -Value "HOST_CC=$hostCc"

      - name: Make python3 available to Git Bash
        # scripts/build-android-youtube-tools.sh and
        # build-android-pot-provider.sh call python3. The Python of the
        # Windows runner has only python.exe, and a python3 found elsewhere
        # on PATH can be the Microsoft Store alias, which doesn't run. So
        # this step puts a python3 script that runs the runner's python.exe
        # into a directory at the front of PATH, for the later steps.
        shell: bash
        run: |
          # Windows Python prints \r\n even to a pipe; drop the \r.
          py=$(cygpath -u "$(python -c 'import sys; print(sys.executable)' | tr -d '\r')")
          shim="$RUNNER_TEMP/python3-shim"
          mkdir -p "$shim"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$py" > "$shim/python3"
          chmod +x "$shim/python3"
          "$shim/python3" -c 'import sys; print(sys.executable, sys.version)'
          cygpath -w "$shim" >> "$GITHUB_PATH"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        # PowerShell: on Windows, sdkmanager is a .bat file, which Git Bash
        # does not find by its plain name.
        shell: pwsh
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdk = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_SDK_ROOT=$($sdk -replace '\\', '/')"

      - name: Install host Qt (for cross-compiling)
        uses: ./.github/actions/install-qt-kit
        with:
          kit: mingw1310_64
          env-var: QT_HOST_PATH
          add-to-path: 'false'

      - name: Install Android Qt
        uses: ./.github/actions/install-qt-kit
        with:
          kit: android_arm64_v8a
          add-to-path: 'false'

      - name: Configure
        # See build.yml's own "Configure" step comment for why
        # CMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH is needed. No
        # QT_NO_GLOBAL_APK_TARGET_PART_OF_ALL here -- this job wants the APK.
        shell: bash
        run: |
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/26.1.10909125/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF \
            -DANDROID_NDK="$ANDROID_SDK_ROOT/ndk/26.1.10909125" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build APK
        shell: bash
        run: cmake --build build-android --target vivace_make_apk --parallel 2

      - name: Locate the built APK
        # androiddeployqt/Gradle's exact output filename isn't hardcoded
        # here on purpose -- see this job's own top comment on why guessing
        # paths has been the recurring failure mode in this whole effort.
        shell: bash
        run: |
          APK=$(find build-android/android-build -iname '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No .apk file found under build-android/android-build"
            find build-android/android-build -maxdepth 4 || true
            exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" Vivace-android-arm64-v8a-debug.apk

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          make_latest: false
          files: Vivace-android-arm64-v8a-debug.apk
