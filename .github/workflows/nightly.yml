name: Nightly

# Rebuilds a single rolling "nightly" pre-release on every push to main, so
# users can grab the latest build between version tags. See release.yml for
# the tag-triggered permanent releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: 'win64_msvc2022_64'
          modules: 'qtmultimedia qtshadertools'
          # See build.yml for why this is needed: aqtinstall's last PyPI
          # release (3.3.0) predates Qt 6.11's repository restructuring.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      - name: Install Meson/Ninja (needed to build libbluray from source for Blu-ray Disc playback)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            choco install meson ninja -y
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "choco install meson/ninja failed (attempt $i), retrying in 30s..."
            Start-Sleep -Seconds 30
            if ($i -eq 3) { exit 1 }
          }
          # choco's meson package is MSI-based and updates the MACHINE/USER
          # PATH in the registry, but does NOT refresh this (or any later
          # step's) already-running process environment -- choco itself
          # warns "Environment Vars (like PATH) have changed. Close/reopen
          # your shell..." and GitHub Actions never does that mid-job. Found
          # the hard way: v0.4.1's real release build silently produced a
          # Blu-ray-DISABLED binary because CMake's find_program(meson)
          # couldn't see it, even though choco reported success. Re-read the
          # registry PATH directly and publish each tool's real directory to
          # $GITHUB_PATH so every later step (in particular CMake's own
          # configure) can see it too -- ninja is included defensively even
          # though it's normally already preinstalled on this runner image.
          $refreshedPath = @(
              [System.Environment]::GetEnvironmentVariable('Path', 'Machine'),
              [System.Environment]::GetEnvironmentVariable('Path', 'User'),
              $env:Path
          ) -join ';'
          $env:Path = $refreshedPath
          foreach ($tool in @('meson', 'ninja')) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $cmd) {
              Write-Error "$tool not found on PATH even after refreshing from the registry"
              exit 1
            }
            $dir = Split-Path $cmd.Source -Parent
            Write-Host "Adding $dir to GITHUB_PATH for $tool"
            Add-Content -Path $env:GITHUB_PATH -Value $dir
          }

      - name: Build the patched qtmultimedia (AV1 + Speed Control + bitmap subtitles) from source
        # Builds against THIS job's own just-installed official Qt kit,
        # rather than swapping in a binary built on a different machine --
        # see scripts/build-patched-qtmultimedia-linux.sh's header comment
        # for why (found the hard way on Linux; applied here too so
        # Windows CI doesn't rely on the same kind of luck).
        shell: pwsh
        env:
          # Authenticates the script's BtbN/FFmpeg-Builds release-list API
          # call (finding the newest release still publishing an n7.1.x
          # FFmpeg line, since "latest"'s own asset list gets pruned over
          # time -- see the script's own comment) so it uses the 5000/hr
          # authenticated rate limit instead of the 60/hr unauthenticated
          # one, which shared GitHub-hosted-runner egress IPs can bump
          # into purely from other jobs' unrelated traffic.
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts\build-patched-qtmultimedia-windows.ps1 -QtDir "$env:QT_ROOT_DIR"

      - name: Install NSIS
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            choco install nsis -y
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "choco install nsis failed (attempt $i), retrying in 30s..."
            Start-Sleep -Seconds 30
          }
          exit 1

      - name: Build installer
        shell: pwsh
        run: packaging/windows/build_installer.ps1 -QtDir "$env:QT_ROOT_DIR"

      - name: Rename installer
        shell: pwsh
        run: Rename-Item VivaceSetup-Release.exe VivaceSetup-Nightly.exe

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Automatic build from the latest `main` commit (${{ github.sha }}).
            May be unstable — prefer a tagged release for daily use.
          files: VivaceSetup-Nightly.exe

  build-and-release-linux:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev patchelf ninja-build meson libx11-dev libxext-dev libxrandr-dev libwayland-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: 'linux_gcc_64'
          # The Wayland client platform plugin already ships inside this
          # base linux_gcc_64 package (no separate "qtwayland" add-on
          # module exists in Qt's online repo -- qtwaylandcompositor is
          # compositor-only). It needs libwayland-dev's runtime libs
          # (installed above) to be present for CMake's Linux deploy
          # step to resolve its dependencies and actually bundle it --
          # see README.md's Requirements section.
          modules: 'qtmultimedia qtshadertools'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      - name: Build the patched qtmultimedia (AV1 + Speed Control + bitmap subtitles) from source
        # Builds against THIS job's own just-installed official Qt kit,
        # rather than swapping in a binary built on a different machine --
        # see scripts/build-patched-qtmultimedia-linux.sh for why (a
        # 2026-08-06 private-ABI mismatch, found the hard way on a real
        # Ubuntu 24.04 install, is what a prebuilt-asset swap can't rule
        # out no matter how carefully it's built).
        env:
          # See the Windows job's identical env block above for why.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/build-patched-qtmultimedia-linux.sh
          scripts/build-patched-qtmultimedia-linux.sh "$QT_ROOT_DIR"

      - name: Build tarball
        run: |
          chmod +x packaging/linux/build_installer.sh
          QT_DIR="$QT_ROOT_DIR" packaging/linux/build_installer.sh --tarball

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          make_latest: false
          files: Vivace-linux-x86_64.tar.gz

  build-and-release-linux-arm64:
    needs: build-and-release
    runs-on: ubuntu-24.04-arm
    # NEW (2026-08-10), for Raspberry Pi OS (64-bit) users. Free GitHub-hosted
    # arm64 Ubuntu runners for public repos went GA 2025-08-07, and Qt DOES
    # ship an official prebuilt linux_gcc_arm64 desktop kit including
    # qtmultimedia (verified directly against download.qt.io's package
    # listing -- not assumed). Otherwise mirrors build-and-release-linux
    # exactly; both scripts/build-patched-qtmultimedia-linux.sh and
    # packaging/linux/build_installer.sh detect `uname -m` themselves to
    # pick the right BtbN FFmpeg archive / output tarball name, so no
    # arch-specific script variant was needed. UNVERIFIED as of this
    # writing -- this is this project's first build on this arch/runner
    # combination, so expect possible follow-up fixes once it actually runs
    # (same caveat the macOS job's own first-run comment carried).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev patchelf ninja-build meson libx11-dev libxext-dev libxrandr-dev libwayland-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: 'linux_gcc_arm64'
          modules: 'qtmultimedia qtshadertools'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      - name: Build the patched qtmultimedia (AV1 + Speed Control + bitmap subtitles) from source
        env:
          # See the Windows job's identical env block above for why.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/build-patched-qtmultimedia-linux.sh
          scripts/build-patched-qtmultimedia-linux.sh "$QT_ROOT_DIR"

      - name: Build tarball
        run: |
          chmod +x packaging/linux/build_installer.sh
          QT_DIR="$QT_ROOT_DIR" packaging/linux/build_installer.sh --tarball

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          make_latest: false
          files: Vivace-linux-aarch64.tar.gz

  build-and-release-linux-arm64-bookworm:
    needs: build-and-release
    runs-on: ubuntu-24.04-arm
    # NEW (2026-08-10): a SECOND arm64 Linux build, specifically for
    # Raspberry Pi OS (Debian 12 "bookworm", glibc 2.36). Qt's official
    # linux_gcc_arm64 kit (used by build-and-release-linux-arm64 above)
    # needs glibc 2.39+ (confirmed against https://doc.qt.io/qt-6/
    # linux-building.html -- Qt's own ARM64 reference platform is a
    # Raspberry Pi 5 running UBUNTU 24.04, not Raspberry Pi OS), which real
    # Raspberry Pi OS doesn't have until it moves to a Debian 13 "trixie"
    # base. Building the whole Qt SDK from source INSIDE a debian:bookworm
    # container (native on this arm64 host, no QEMU) produces binaries that
    # only need glibc 2.36, which Raspberry Pi OS already has. Debian's apt
    # only carries Qt 6.4.2 (too old for this project's qtmultimedia patches,
    # which are diffs against v6.11.1 and reference 6.11-specific internals),
    # so this builds qtbase/qtshadertools/qtdeclarative/qttools from source
    # too, not just qtmultimedia -- see scripts/build-qt-from-source-
    # bookworm.sh's own header comment for why it's plain `cmake`, not Qt's
    # `configure` wrapper. UNVERIFIED as of this writing -- first build on
    # this exact combination (container job + from-source Qt SDK); expect
    # possible follow-up fixes.
    container:
      image: debian:bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build git \
            curl ca-certificates perl python3 \
            pkg-config patchelf libssl-dev libgl1-mesa-dev meson \
            libglu1-mesa-dev libwayland-dev libfontconfig1-dev libfreetype-dev \
            libgtk-3-dev libx11-dev libx11-xcb-dev libxcb-cursor-dev \
            libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xkb-dev \
            libxcb1-dev libxext-dev libxfixes-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxrender-dev libatspi2.0-dev \
            libpulse-dev

      - name: Checkout
        uses: actions/checkout@v4

      # Caches the ENTIRE built SDK (qtbase+qtshadertools+qtdeclarative+
      # qttools, then qtmultimedia rebuilt in place on top of it) as one
      # atomic unit -- safe here in a way swapping in a separately-built
      # qtmultimedia was NOT (see the 2026-08-06 "Ubuntu 24 crashes" /
      # private-ABI-mismatch entries in CLAUDE.md): everything below is
      # built together, from the same source, in the same container, on
      # every cache MISS, so a cache HIT is byte-identical to what a fresh
      # build would have produced, never a mix of old+new pieces. The key
      # hashes the patch files and both build scripts, so any change to
      # either automatically invalidates the cache and forces a rebuild.
      - name: Cache built Qt SDK (bookworm)
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: /opt/qt6
          key: qt6-bookworm-arm64-${{ hashFiles('patches/qtmultimedia-*.patch', 'scripts/build-qt-from-source-bookworm.sh', 'scripts/build-patched-qtmultimedia-linux.sh', '.github/workflows/nightly.yml') }}

      - name: Build Qt 6.11.1 base SDK from source (qtbase + qtshadertools + qtdeclarative + qttools)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build-qt-from-source-bookworm.sh
          scripts/build-qt-from-source-bookworm.sh /opt/qt6

      - name: Build the patched qtmultimedia (AV1 + Speed Control + bitmap subtitles) from source
        if: steps.qt-cache.outputs.cache-hit != 'true'
        env:
          # See the Windows job's identical env block above for why.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/build-patched-qtmultimedia-linux.sh
          scripts/build-patched-qtmultimedia-linux.sh /opt/qt6

      - name: Build tarball
        run: |
          chmod +x packaging/linux/build_installer.sh
          QT_DIR=/opt/qt6 packaging/linux/build_installer.sh --tarball
          mv Vivace-linux-aarch64.tar.gz Vivace-linux-aarch64-bookworm.tar.gz

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          make_latest: false
          files: Vivace-linux-aarch64-bookworm.tar.gz

  build-and-release-macos:
    needs: build-and-release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: 'clang_64'
          modules: 'qtmultimedia qtshadertools'

      - name: Install Meson/Ninja (needed to build libbluray from source for Blu-ray Disc playback)
        run: brew install meson ninja

      - name: Build the patched qtmultimedia (AV1 + Speed Control + bitmap subtitles) from source
        # Builds against THIS job's own just-installed official Qt kit,
        # rather than the old approach of merely swapping in an AV1-capable
        # FFmpeg with none of the three patches actually applied (macOS was
        # the one platform left on that older, weaker approach -- see
        # scripts/build-patched-qtmultimedia-macos.sh's header comment).
        # UNVERIFIED as of 2026-08-07 -- no macOS machine available during
        # development; expect possible follow-up fixes once this actually
        # runs.
        run: |
          chmod +x scripts/build-patched-qtmultimedia-macos.sh
          scripts/build-patched-qtmultimedia-macos.sh "$QT_ROOT_DIR"

      - name: Build dmg
        run: |
          chmod +x packaging/macos/build_installer.sh
          QT_DIR="$QT_ROOT_DIR" packaging/macos/build_installer.sh --dmg

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          make_latest: false
          files: Vivace-macos.dmg

  build-and-release-android:
    needs: build-and-release
    runs-on: ubuntu-latest
    # NEW (2026-09-20): builds a real, installable Android APK, extending the
    # compile-only Android job already proven working in build.yml (see that
    # job's own comment history for the SDK/NDK/Qt-for-Android setup and the
    # three real CI fixes it took to get there -- the setup steps here mirror
    # it exactly). The one addition: a JDK (AGP 9.0.0's own compatibility
    # table requires JDK 17 minimum, confirmed directly against
    # developer.android.com/build/releases/agp-9-0-0-release-notes) and
    # building the `vivace_make_apk` target instead of plain `vivace`, which
    # runs androiddeployqt + Gradle to actually produce a package (per Qt's
    # own qt_android_add_apk_target docs: qt_add_executable already wires
    # this target up automatically, no qt_android_add_apk_target() call
    # needed in CMakeLists.txt).
    #
    # DEBUG-SIGNED, not a production release build: no real Android signing
    # keystore/secrets exist for this project yet (matching every other
    # platform here -- none of them have real code-signing set up either,
    # see this project's own [[project-vivace-code-signing-reputation]]
    # history), so this is Gradle's own auto-generated debug key. Good
    # enough to sideload and test, not to publish to the Play Store as-is.
    #
    # Also does NOT build any of the four qtmultimedia source patches
    # (AV1-hwaccel-disable / WSOLA pitch compensation / bitmap-subtitle
    # display / deinterlace) -- Android uses the plain aqt-installed stock
    # Qt-for-Android kit, same as build.yml's job; patching qtmultimedia for
    # a cross-compiled Android target is a separate, not-yet-attempted
    # undertaking.
    #
    # UNVERIFIED as of this writing: this is the first time this project's
    # CI has ever built (not just compiled) an Android APK -- the exact
    # output path/filename from androiddeployqt+Gradle is discovered via a
    # glob rather than hardcoded, specifically because guessing it wrong is
    # exactly the class of mistake this whole Android CI effort kept hitting
    # (see build.yml's own job history); expect this may still need a
    # follow-up fix once it actually runs, and the resulting APK still needs
    # a real device/emulator install test before being trusted.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Install host Qt (for cross-compiling)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: linux_gcc_64
          # qtwebview added 2026-09-24 (CI fix): CMakeLists.txt's Android-only
          # embedded-YouTube-login feature unconditionally does
          # find_package(Qt6 REQUIRED COMPONENTS WebView WebViewQuick) once
          # ANDROID is true -- neither module was ever requested here, so
          # every Android CI build failed at configure time the moment that
          # feature landed ("Failed to find required Qt component WebView",
          # media/build.log). Added to both this host install and the
          # Android-target install below, matching qtmultimedia/qtshadertools'
          # own existing host+target pattern.
          modules: 'qtmultimedia qtshadertools qtwebview'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      - name: Remember the host Qt path
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Android Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: 'qtmultimedia qtshadertools qtwebview'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      - name: Configure
        # See build.yml's own "Configure" step comment for why
        # CMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH is needed. No
        # QT_NO_GLOBAL_APK_TARGET_PART_OF_ALL here -- this job wants the APK.
        run: |
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/26.1.10909125/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF \
            -DANDROID_NDK="$ANDROID_SDK_ROOT/ndk/26.1.10909125" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build APK
        run: cmake --build build-android --target vivace_make_apk --parallel 2

      - name: Locate the built APK
        # androiddeployqt/Gradle's exact output filename isn't hardcoded
        # here on purpose -- see this job's own top comment on why guessing
        # paths has been the recurring failure mode in this whole effort.
        run: |
          APK=$(find build-android/android-build -iname '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No .apk file found under build-android/android-build"
            find build-android/android-build -maxdepth 4 || true
            exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" Vivace-android-arm64-v8a-debug.apk

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          make_latest: false
          files: Vivace-android-arm64-v8a-debug.apk
