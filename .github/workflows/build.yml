name: Build

# Fast feedback: configure + build only, no packaging, across all three
# target platforms. Runs on every push/PR to main; see release.yml for the
# tag-triggered Windows installer build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            qt-arch: win64_msvc2022_64
          - os: ubuntu-latest
            qt-arch: linux_gcc_64
          - os: macos-latest
            qt-arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev patchelf meson ninja-build

      - name: Install Meson/Ninja (Windows/macOS; needed to build libbluray from source for Blu-ray Disc playback)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            for i in 1 2 3; do
              choco install meson ninja -y && break
              echo "choco install meson/ninja failed (attempt $i), retrying in 30s..."
              sleep 30
              if [ "$i" = 3 ]; then exit 1; fi
            done
            # choco's meson package is MSI-based and updates the MACHINE/USER
            # PATH in the registry, but does NOT refresh this already-running
            # process's own environment -- choco itself warns "Environment
            # Vars (like PATH) have changed. Close/reopen your shell..." and
            # GitHub Actions never does that mid-job. Found the hard way:
            # v0.4.1's real release build silently produced a Blu-ray-DISABLED
            # binary because CMake's find_program(meson) couldn't see it, even
            # though choco reported success. Ask PowerShell (which has direct
            # .NET registry-PATH access) to re-read it and locate each tool,
            # then publish its real directory to $GITHUB_PATH so later steps
            # (in particular CMake's own configure) can see it too -- ninja is
            # included defensively even though it's normally already
            # preinstalled on this runner image.
            for tool in meson ninja; do
              dir=$(powershell.exe -NoProfile -Command "
                \$env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User') + ';' + \$env:Path
                \$cmd = Get-Command $tool -ErrorAction SilentlyContinue
                if (\$cmd) { (Split-Path \$cmd.Source -Parent) }
              " | tr -d '\r')
              if [ -z "$dir" ]; then
                echo "$tool not found on PATH even after refreshing from the registry" >&2
                exit 1
              fi
              echo "Adding $dir to GITHUB_PATH for $tool"
              echo "$dir" >> "$GITHUB_PATH"
            done
          else
            brew install meson ninja
          fi

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: ${{ matrix.qt-arch }}
          modules: 'qtmultimedia qtshadertools'
          # aqtinstall's last PyPI release (3.3.0) predates Qt 6.11's repository
          # restructuring (per-toolchain top-level dirs on Windows, modules moved
          # under an "addons." package namespace) -- see aqtinstall#959, fixed by
          # aqtinstall PR#1000 (merged, not yet tagged/released to PyPI). Install
          # aqtinstall from that merge commit until a release picks it up.
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        # -G Ninja, not the default "Unix Makefiles" -- see
        # packaging/macos/build_installer.sh's comment for why (a real CI
        # "No rule to make target ... libudfread.a" failure with the
        # Makefiles generator, unrelated to a wrong path).
        run: cmake -B build -G Ninja -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        # Capped, not the plain unbounded --parallel this used before: a real
        # CI run (2026-08-17) showed the Linux job silently killed mid-build
        # (gmake "Error 2" with NO compiler/linker diagnostic anywhere in the
        # log -- the signature of an OOM kill, not a real code error) shortly
        # after several object files started compiling in parallel, not long
        # after libbluray's from-source build was added to this same job.
        # GitHub's standard Linux runner has 4 vCPUs/16GB RAM; several of
        # Vivace's own translation units (Qt's AOT-compiled QML files, the
        # newer Blu-ray sources) are heavy enough that 4-way parallelism can
        # exceed that comfortably. --parallel 2 halves peak memory at the
        # cost of some wall-clock time -- the same trade-off already applied
        # to the arm64/Bookworm from-source Qt build job for the identical
        # reason (see release.yml/nightly.yml). Windows/macOS didn't fail in
        # that run, but capping them too keeps this one shared step simple
        # and is a small, safe cost.
        run: cmake --build build --config Release --parallel 2

  # Android: a genuinely different build shape from the desktop matrix above
  # (cross-compiling needs both a host and an Android Qt kit, an NDK/SDK, and
  # Vivace's own Android-only CMake options -- VIVACE_ENABLE_PYTHON_YOUTUBE's
  # embedded CPython, VIVACE_ENABLE_YOUTUBE_DOWNLOAD_TOOLS' bundled ffmpeg +
  # Node.js), so it's its own job rather than a 4th entry squeezed into that
  # matrix's shared steps. Compile-only, matching this workflow's own stated
  # "no packaging" scope for every other platform -- QT_NO_GLOBAL_APK_TARGET_
  # PART_OF_ALL keeps a plain build from also invoking Gradle/androiddeployqt
  # (which would need a JDK/signing setup this job doesn't have). UNVERIFIED:
  # this is the first CI run ever attempted for Android in this project --
  # every other new-platform CI job added here (Linux arm64, the Bookworm
  # from-source job) needed real iteration once actually run, and this one
  # has more new moving parts (SDK/NDK, two Qt kits, the bundled-tools native
  # build) than any of those did at the start.
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        # meson/ninja: builds libbluray from source (VIVACE_ENABLE_BLURAY),
        # same as the desktop Linux job above -- Vivace's own CMakeLists.txt
        # treats this identically regardless of target platform.
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build

      - name: Set up Android SDK
        # CI FIX 2026-09-20 (first real run of this job failed here): this
        # action's own default `packages` input is "tools platform-tools" --
        # but Google removed the legacy "Android SDK Tools" package ('tools')
        # from its repository years ago, so `sdkmanager tools` fails with
        # "Warning: Failed to find package 'tools'" and the action throws,
        # exiting the whole job before NDK/Qt installation ever runs (real
        # log: media/build-android-log-20260920T120300.txt). Vivace's own
        # build never needs the legacy tools package (NDK is installed
        # separately below via `sdkmanager --install`), so just install
        # platform-tools.
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        # Pinned to the exact version this project's own local (Qt Creator)
        # Android builds already use (.qtcreator/CMakeLists.txt.user) --
        # keeping CI on the same NDK as the tested local dev builds avoids
        # introducing a second, unverified NDK version into the mix.
        # android-actions/setup-android is expected to put sdkmanager on
        # PATH and set both ANDROID_HOME/ANDROID_SDK_ROOT, but that isn't
        # verified against a real run yet (see this job's own top-level
        # comment) -- the explicit fallback/re-export just makes the later
        # Configure step robust if only one of the two ends up set.
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Install host Qt (for cross-compiling)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: linux_gcc_64
          modules: 'qtmultimedia qtshadertools'
          # Same aqtinstall pin as the desktop jobs above -- see that step's
          # own comment (aqtinstall#959 vs. Qt 6.11's repository layout).
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      - name: Remember the host Qt path
        # install-qt-action's own QT_ROOT_DIR env var gets overwritten by
        # the Android Qt install below -- capture it now under its own name
        # for the Android configure step's -DQT_HOST_PATH (cross-compiling
        # needs a host Qt for build-time tools like qmlcachegen/qsb, which
        # can't run as Android binaries on this runner).
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Android Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          target: android
          arch: android_arm64_v8a
          modules: 'qtmultimedia qtshadertools'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      - name: Configure
        # Mirrors this project's own real, tested local Android configure
        # (.qtcreator/CMakeLists.txt.user's CMake.Initial.Parameters) as
        # closely as possible, rather than guessing at CMake/Qt-for-Android
        # flags from scratch.
        run: |
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/26.1.10909125/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF \
            -DANDROID_NDK="$ANDROID_SDK_ROOT/ndk/26.1.10909125" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DQT_NO_GLOBAL_APK_TARGET_PART_OF_ALL=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # --parallel 2, same OOM-avoidance reasoning as the desktop Linux
        # job above -- this build compiles at least as much per translation
        # unit (the same AOT QML/Blu-ray sources, plus the Android-only
        # embedded-CPython and pythonyoutuberesolver.cpp sources) on the
        # same class of runner.
        run: cmake --build build-android --target vivace --parallel 2
