name: Build

# Fast feedback: configure + build only, no packaging, across all three
# target platforms. Runs on every push/PR to main; see release.yml for the
# tag-triggered Windows installer build.
#
# Every job uses a Qt kit from a vivace-qt-build release (see
# .github/actions/install-qt-kit): the kits already contain the Vivace
# qtmultimedia patches and an LGPL FFmpeg, so no job builds qtmultimedia.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            qt-kit: msvc2022_64
          - os: ubuntu-latest
            qt-kit: gcc_64
          - os: macos-latest
            qt-kit: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        # libva2/libva-drm2: the FFmpeg of the gcc_64 kit links libva.so.2
        # and libva-drm.so.2 (VA-API).
        # The -dev packages after libva-drm2: the system libraries that the Qt
        # libraries, tools (moc, rcc) and plugins of the kit link, for
        # example libb2 and ICU. They are packages that built the kit.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev patchelf meson ninja-build libminizip1 libva2 libva-drm2 \
            libb2-dev libbrotli-dev libdbus-1-dev libicu-dev libpcre2-dev libzstd-dev libegl-dev libopengl-dev libdrm-dev libinput-dev libmtdev-dev libts-dev libudev-dev

      - name: Install Meson/Ninja (Windows/macOS; needed to build libbluray from source for Blu-ray Disc playback)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            for i in 1 2 3; do
              choco install meson ninja -y && break
              echo "choco install meson/ninja failed (attempt $i), retrying in 30s..."
              sleep 30
              if [ "$i" = 3 ]; then exit 1; fi
            done
            # choco's meson package is MSI-based and updates the MACHINE/USER
            # PATH in the registry, but does NOT refresh this already-running
            # process's own environment -- choco itself warns "Environment
            # Vars (like PATH) have changed. Close/reopen your shell..." and
            # GitHub Actions never does that mid-job. Found the hard way:
            # v0.4.1's real release build silently produced a Blu-ray-DISABLED
            # binary because CMake's find_program(meson) couldn't see it, even
            # though choco reported success. Ask PowerShell (which has direct
            # .NET registry-PATH access) to re-read it and locate each tool,
            # then publish its real directory to $GITHUB_PATH so later steps
            # (in particular CMake's own configure) can see it too -- ninja is
            # included defensively even though it's normally already
            # preinstalled on this runner image.
            for tool in meson ninja; do
              dir=$(powershell.exe -NoProfile -Command "
                \$env:Path = [System.Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [System.Environment]::GetEnvironmentVariable('Path','User') + ';' + \$env:Path
                \$cmd = Get-Command $tool -ErrorAction SilentlyContinue
                if (\$cmd) { (Split-Path \$cmd.Source -Parent) }
              " | tr -d '\r')
              if [ -z "$dir" ]; then
                echo "$tool not found on PATH even after refreshing from the registry" >&2
                exit 1
              fi
              echo "Adding $dir to GITHUB_PATH for $tool"
              echo "$dir" >> "$GITHUB_PATH"
            done
          else
            brew install meson ninja
          fi

      - name: Install Qt
        uses: ./.github/actions/install-qt-kit
        with:
          kit: ${{ matrix.qt-kit }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        # -G Ninja, not the default "Unix Makefiles" -- see
        # packaging/macos/build_installer.sh's comment for why (a real CI
        # "No rule to make target ... libudfread.a" failure with the
        # Makefiles generator, unrelated to a wrong path).
        run: cmake -B build -G Ninja -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build
        # Capped, not the plain unbounded --parallel this used before: a real
        # CI run (2026-08-17) showed the Linux job silently killed mid-build
        # (gmake "Error 2" with NO compiler/linker diagnostic anywhere in the
        # log -- the signature of an OOM kill, not a real code error) shortly
        # after several object files started compiling in parallel, not long
        # after libbluray's from-source build was added to this same job.
        # GitHub's standard Linux runner has 4 vCPUs/16GB RAM; several of
        # Vivace's own translation units (Qt's AOT-compiled QML files, the
        # newer Blu-ray sources) are heavy enough that 4-way parallelism can
        # exceed that comfortably. --parallel 2 halves peak memory at the
        # cost of some wall-clock time. Windows/macOS didn't fail in that
        # run, but capping them too keeps this one shared step simple and is
        # a small, safe cost.
        run: cmake --build build --config Release --parallel 2

  # Android: a genuinely different build shape from the desktop matrix above
  # (cross-compiling needs both a host and an Android Qt kit, an NDK/SDK, and
  # Vivace's own Android-only CMake options -- VIVACE_ENABLE_PYTHON_YOUTUBE's
  # embedded CPython, VIVACE_ENABLE_YOUTUBE_DOWNLOAD_TOOLS' bundled ffmpeg +
  # Node.js), so it's its own job rather than a 4th entry squeezed into that
  # matrix's shared steps. Compile-only, matching this workflow's own stated
  # "no packaging" scope for every other platform -- QT_NO_GLOBAL_APK_TARGET_
  # PART_OF_ALL keeps a plain build from also invoking Gradle/androiddeployqt
  # (which would need a JDK/signing setup this job doesn't have).
  #
  # Runs on Windows: the Android kits of vivace-qt-build were built with the
  # mingw1310_64 kit as their host Qt, so this job uses the same host kit,
  # like the local Qt Creator builds on Windows. The MinGW kit links the GCC
  # runtime statically, so its host tools need no MinGW installation.
  # CMakeLists.txt runs the bundled-tools scripts with Git for Windows' bash.
  build-android:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Meson, Ninja and GNU Make
        # Meson/Ninja build libbluray from source. GNU Make runs FFmpeg's
        # build in scripts/build-android-youtube-tools.sh: Git for Windows
        # ships no make.exe, and that script expects Chocolatey's GNU Make,
        # as on the local Windows dev machine. Same choco install and
        # registry-PATH refresh as the release workflow's Windows job --
        # see its comment for why.
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            choco install meson ninja make -y
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "choco install meson/ninja/make failed (attempt $i), retrying in 30s..."
            Start-Sleep -Seconds 30
            if ($i -eq 3) { exit 1 }
          }
          $env:Path = @(
              [System.Environment]::GetEnvironmentVariable('Path', 'Machine'),
              [System.Environment]::GetEnvironmentVariable('Path', 'User'),
              $env:Path
          ) -join ';'
          foreach ($tool in @('meson', 'ninja', 'make')) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $cmd) {
              Write-Error "$tool not found on PATH even after refreshing from the registry"
              exit 1
            }
            $dir = Split-Path $cmd.Source -Parent
            Write-Host "Adding $dir to GITHUB_PATH for $tool"
            Add-Content -Path $env:GITHUB_PATH -Value $dir
          }

      - name: Make python3 available to Git Bash
        # scripts/build-android-youtube-tools.sh and
        # build-android-pot-provider.sh call python3. The Python of the
        # Windows runner has only python.exe, and a python3 found elsewhere
        # on PATH can be the Microsoft Store alias, which doesn't run. So
        # this step puts a python3 script that runs the runner's python.exe
        # into a directory at the front of PATH, for the later steps.
        shell: bash
        run: |
          # Windows Python prints \r\n even to a pipe; drop the \r.
          py=$(cygpath -u "$(python -c 'import sys; print(sys.executable)' | tr -d '\r')")
          shim="$RUNNER_TEMP/python3-shim"
          mkdir -p "$shim"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$py" > "$shim/python3"
          chmod +x "$shim/python3"
          "$shim/python3" -c 'import sys; print(sys.executable, sys.version)'
          cygpath -w "$shim" >> "$GITHUB_PATH"

      - name: Set up Android SDK
        # CI FIX 2026-09-20 (first real run of this job failed here): this
        # action's own default `packages` input is "tools platform-tools" --
        # but Google removed the legacy "Android SDK Tools" package ('tools')
        # from its repository years ago, so `sdkmanager tools` fails with
        # "Warning: Failed to find package 'tools'" and the action throws,
        # exiting the whole job before NDK/Qt installation ever runs (real
        # log: media/build-android-log-20260920T120300.txt). Vivace's own
        # build never needs the legacy tools package (NDK is installed
        # separately below via `sdkmanager --install`), so just install
        # platform-tools.
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        # Pinned to the NDK that built the Android kits of vivace-qt-build,
        # which is also the one of this project's local (Qt Creator)
        # Android builds (.qtcreator/CMakeLists.txt.user). PowerShell, not
        # bash: on Windows, sdkmanager is a .bat file, which Git Bash does
        # not find by its plain name.
        shell: pwsh
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdk = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_SDK_ROOT=$($sdk -replace '\\', '/')"

      - name: Install host Qt (for cross-compiling)
        uses: ./.github/actions/install-qt-kit
        with:
          kit: mingw1310_64
          env-var: QT_HOST_PATH
          add-to-path: 'false'

      - name: Install Android Qt
        uses: ./.github/actions/install-qt-kit
        with:
          kit: android_arm64_v8a
          add-to-path: 'false'

      - name: Configure
        # Mirrors this project's own real, tested local Android configure
        # (.qtcreator/CMakeLists.txt.user's CMake.Initial.Parameters) as
        # closely as possible, rather than guessing at CMake/Qt-for-Android
        # flags from scratch.
        #
        # CI FIX 2026-09-20 (real run failed here): the NDK's own toolchain
        # file sets CMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY when cross-
        # compiling, which restricts find_package()'s CONFIG-mode lookup
        # (used by find_package(Qt6 ...)) to the NDK sysroot only --
        # CMAKE_PREFIX_PATH is completely ignored, so Qt6Config.cmake is
        # never found even though it genuinely exists under $QT_ROOT_DIR.
        # Qt Creator's own local Android builds work without this flag only
        # because Qt Creator auto-injects its own CMAKE_PROJECT_INCLUDE_BEFORE
        # helper file that sets this (among other things).
        shell: bash
        run: |
          cmake -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/26.1.10909125/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DANDROID_USE_LEGACY_TOOLCHAIN_FILE=OFF \
            -DANDROID_NDK="$ANDROID_SDK_ROOT/ndk/26.1.10909125" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DQT_NO_GLOBAL_APK_TARGET_PART_OF_ALL=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # --parallel 2, same OOM-avoidance reasoning as the desktop Linux
        # job above -- this build compiles at least as much per translation
        # unit (the same AOT QML/Blu-ray sources, plus the Android-only
        # embedded-CPython and pythonyoutuberesolver.cpp sources).
        shell: bash
        run: cmake --build build-android --target vivace --parallel 2
