# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx3200m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable building projects in parallel
org.gradle.parallel=true

# Real bug found 2026-09-26 (vivace-home-settings's build.bat "hangs at
# the near-last stage" -- the log shows androiddeployqt's own final
# success line, "Android package built successfully", plus the printed
# .apk path, then nothing further ever appears, forever). Root cause:
# Gradle's daemon deliberately outlives the gradlew invocation that
# started it (by design, to speed up future builds), and it inherits
# the whole invoking process tree's stdout/stderr pipe handles -- Ninja
# (the outer build.bat's -G Ninja driver) waits for that pipe to hit
# EOF, which only happens once EVERY process holding it closes, and the
# orphaned daemon never does. Disabling the daemon outright means
# nothing is ever left running to hold the pipe open.
org.gradle.daemon=false

# Gradle caching allows reusing the build artifacts from a previous
# build with the same inputs. However, over time, the cache size will
# grow. Uncomment the following line to enable it.
#org.gradle.caching=true
#org.gradle.configuration-cache=true

# Allow AndroidX usage
android.useAndroidX=true

# User-defined properties
@EXTRA_PROPERTIES@
